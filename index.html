<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisobotlar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #f4f6f9);
            color: var(--tg-theme-text-color, #333);
            margin: 0;
        }
        h2 { margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .format-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .format-btn {
            width: 45%;
            padding: 15px;
            margin: 10px 2%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            display: inline-block;
        }
        .pdf-btn { background-color: #e74c3c; color: white; }
        .excel-btn { background-color: #27ae60; color: white; }
    </style>
</head>
<body>

    <h2>📊 Kerakli hisobotni tanlang</h2>
    
    <button class="btn" onclick="askFormat('haftalik')">📅 Haftalik hisobot</button>
    <button class="btn" onclick="askFormat('oylik')">📆 Oylik hisobot</button>
    <button class="btn" onclick="askFormat('barcha')">📈 Barcha hisobotlar (Diagramma bilan)</button>

    <div id="formatBox" class="format-box">
        <h3 id="reportTitle">Hisobot</h3>
        <p>Qaysi formatda yuklab olmoqchisiz?</p>
        <button class="format-btn pdf-btn" onclick="sendReportRequest('pdf')">📕 PDF</button>
        <button class="format-btn excel-btn" onclick="sendReportRequest('excel')">📗 Excel</button>
    </div>

    <script>
        let selectedReport = "";
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ekranni to'liq ochish

        function askFormat(type) {
            selectedReport = type;
            document.getElementById('formatBox').style.display = 'block';
            
            let title = "";
            if(type === 'haftalik') title = "Haftalik hisobot";
            if(type === 'oylik') title = "Oylik hisobot";
            if(type === 'barcha') title = "Barcha hisobotlar";
            
            document.getElementById('reportTitle').innerText = title;
            
            // Format tanlash qismiga sekin tushish
            document.getElementById('formatBox').scrollIntoView({ behavior: 'smooth' });
        }

        function sendReportRequest(format) {
            let data = {
                action: "get_report",
                report_type: selectedReport,
                format: format
            };
            // Tanlovni Telegram botga jo'natish
            tg.sendData(JSON.stringify(data));
            tg.close(); // Mini App'ni yopish
        }
    </script>
</body>
</html>
