<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisobotlar</title>
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .report-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Yuqori sarlavha bloklari */
        .title-box {
            width: 100%;
            padding: 16px;
            text-align: center;
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .haftalik { background-color: #000000; }
        .oylik { background-color: #00a2e8; }
        .umumiy { background-color: #00a859; }

        /* PDF / EXCEL tugmalari joylashuvi */
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin-top: 10px;
        }

        .sub-btn {
            background-color: #4f71be;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s ease, background-color 0.2s;
            width: 45%;
            text-align: center;
        }

        .sub-btn:active {
            transform: scale(0.95);
            background-color: #3b5998;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HAFTALIK XISOBOT -->
    <div class="report-card">
        <div class="title-box haftalik">XAFTALIK XISOBOT</div>
        <div class="btn-group">
            <button class="sub-btn" onclick="sendReport('haftalik', 'pdf')">PDF</button>
            <button class="sub-btn" onclick="sendReport('haftalik', 'excel')">EXCEL</button>
        </div>
    </div>

    <!-- OYLIK XISOBOT -->
    <div class="report-card">
        <div class="title-box oylik">OYLIK XISOBOT</div>
        <div class="btn-group">
            <button class="sub-btn" onclick="sendReport('oylik', 'pdf')">PDF</button>
            <button class="sub-btn" onclick="sendReport('oylik', 'excel')">EXCEL</button>
        </div>
    </div>

    <!-- UMUMIY XISOBOT -->
    <div class="report-card">
        <div class="title-box umumiy">UMUMIY XISOBOT</div>
        <div class="btn-group">
            <button class="sub-btn" onclick="sendReport('umumiy', 'pdf')">PDF</button>
            <button class="sub-btn" onclick="sendReport('umumiy', 'excel')">EXCEL</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function sendReport(period, format) {
        const payload = {
            period: period,
            format: format
        };
        // Telegram botga ma'lumotni yuborish va Mini App'ni yopish
        tg.sendData(JSON.stringify(payload));
    }
</script>

</body>
</html>
